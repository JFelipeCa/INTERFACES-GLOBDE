<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catalogo</title>
  <link rel="stylesheet" href="css/globde.css">
</head>
<body>
  <nav data-nav></nav>

  <div class="container page-shell">
    <div class="page-heading">
      <h1>Catalogo de servicios</h1>
      <p>El catalogo muestra imagenes de pureba, el resultado final puede variar.</p>
    </div>

    <div id="panelCrearServicio" class="admin-only">
      <div class="form-grid">
        <input type="text" id="nombreServicio" placeholder="Nombre del servicio">
        <textarea id="descripcionServicio" placeholder="Descripcion"></textarea>
        <input type="number" id="precioServicio" placeholder="Precio">
        <input type="number" id="duracionServicio" placeholder="Duracion en minutos">
        <select id="corteServicio">
          <option value="">Selecciona un corte asociado</option>
        </select>
      </div>

      <button type="button" onclick="agregarServicio()">Agregar servicio</button>
    </div>

    <ul id="listaServicios"></ul>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/globde.js"></script>
  <script>
    if (protegerRuta()) {
      construirMenu();
      if (esCliente()) {
        document.getElementById("panelCrearServicio").style.display = "none";
      }
    }
  </script>
  <script src="js/catalogo.js"></script>
</body>
</html>
